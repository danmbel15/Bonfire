apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

#Environment Variable Creation
configMapGenerator:
  - name: bonfire-config
    envs:
      - configmap.env
  - name: bonfire-lavalink-config
    files:
      - application.yml
secretGenerator:
  - name: bonfire-secrets
    envs:
      - secrets.env

resources:
  - bot-deployment-def.yaml
  - lavalink-deployment-def.yaml
  - lavalink-clusterip-service.yaml
  - music-pvc.yaml
  - audio-startup-service.yaml
